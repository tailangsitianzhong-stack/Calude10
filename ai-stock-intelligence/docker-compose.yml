# AI STOCK INTELLIGENCE（フェーズ2）
# 起動：.env.example を .env にコピーして値を設定 → docker compose up -d --build
# 銘柄マスタの取り込み：docker compose run --rm api python -m scripts.load_securities
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-asi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 20
    # データベースは外部に公開しない（ports を設定しない）

  api:
    build:
      context: ./backend
      secrets: [extra_ca]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-asi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asi}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      retries: 10
    # API は Web からだけ使う。手元で確認する場合のため 127.0.0.1 にだけ公開
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      secrets: [extra_ca]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:

secrets:
  # 通常は空のファイル（不要）。プロキシ環境では EXTRA_CA_CERT_FILE にCA証明書のパスを指定する
  extra_ca:
    file: ${EXTRA_CA_CERT_FILE:-./.empty-ca.pem}
